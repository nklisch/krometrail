name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Rust quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check wire enum schema declarations
        run: bash scripts/check-wire-enum-schemas.sh

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-msrv:
    name: Rust MSRV 1.85 gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.85 toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  distribution:
    name: Distribution contract checks
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Check shell syntax
        run: |
          sh -n scripts/install.sh
          bash -n scripts/dev-install.sh
          bash -n tests/distribution-static.sh
          bash -n tests/installer-fixtures.sh
          bash -n tests/plugin-bootstrap-fixtures.sh

      - name: Check distribution contracts
        run: bash tests/distribution-static.sh

      # These suites are hermetic (no network, Chrome, or model calls) and were
      # previously only syntax-checked, so installer and plugin regressions
      # could not fail CI.
      - name: Check installer contracts
        run: bash tests/installer-fixtures.sh

      - name: Check plugin bootstrap contracts
        run: bash tests/plugin-bootstrap-fixtures.sh

      - name: Check plugin package contracts
        run: bash tests/plugin-static.sh
