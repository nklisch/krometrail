name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Rust quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check wire enum schema declarations
        run: bash scripts/check-wire-enum-schemas.sh

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Install qualified linter
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy
      - name: Run Clippy
        # This style-only lint has 13 pre-existing findings in independently versioned temporal-vision.
        run: |
          rustup run 1.98.0 cargo-clippy clippy --version
          rustup run 1.98.0 cargo-clippy clippy --workspace --all-targets --locked -- -D warnings -A clippy::chunks_exact_to_as_chunks

  temporal-vision-version-gate:
    # temporal-vision is versioned independently of the workspace. Policy:
    # any PR that changes the crate's source must bump its version in the
    # same PR, so a release tag never carries an unstaged change and never
    # republishes unchanged code.
    name: temporal-vision version gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require version bump when temporal-vision changes
        run: |
          set -e
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- crates/temporal-vision/ || true)
          if [ -z "$CHANGED" ]; then
            echo "temporal-vision untouched; gate passes"
            exit 0
          fi
          BEFORE=$(git show origin/${{ github.base_ref }}:crates/temporal-vision/Cargo.toml | grep -m1 '^version' | cut -d'"' -f2)
          AFTER=$(grep -m1 '^version' crates/temporal-vision/Cargo.toml | cut -d'"' -f2)
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "crates/temporal-vision changed but its version is still $AFTER."
            echo "Bump the version in crates/temporal-vision/Cargo.toml (independent of the workspace version)."
            exit 1
          fi
          echo "temporal-vision bumped $BEFORE -> $AFTER; gate passes"

  rust-msrv:
    name: Rust minimum-version gate (Linux)
    runs-on: ubuntu-latest
    env:
      MSRV_TOOLCHAIN: 1.88.0
    # rust-toolchain.toml selects stable: installing a default is not selection.
    # Formatting and Clippy belong to the stable job, not compiler compatibility:
    # their output/rules evolve independently of the supported compiler minimum.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install minimum Rust toolchain
        run: rustup toolchain install "$MSRV_TOOLCHAIN" --profile minimal

      - name: Report minimum toolchain identities
        run: |
          rustup run "$MSRV_TOOLCHAIN" rustc --version
          rustup run "$MSRV_TOOLCHAIN" cargo --version

      - name: Check workspace
        run: rustup run "$MSRV_TOOLCHAIN" cargo check --workspace --all-targets --locked

      - name: Run tests
        run: rustup run "$MSRV_TOOLCHAIN" cargo test --workspace --all-targets --locked

  distribution:
    name: Distribution contract checks
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Check shell syntax
        run: |
          sh -n scripts/install.sh
          bash -n scripts/dev-install.sh
          bash -n tests/distribution-static.sh
          bash -n tests/installer-fixtures.sh
          bash -n tests/plugin-bootstrap-fixtures.sh

      # distribution-static.sh also invokes installer-fixtures.sh,
      # plugin-bootstrap-fixtures.sh, and plugin-static.sh.
      - name: Check distribution contracts
        run: bash tests/distribution-static.sh
