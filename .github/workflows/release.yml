name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3)"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate-release-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag_sha: ${{ steps.resolve-tag.outputs.tag_sha }}
    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Validate and resolve exact tag
        id: resolve-tag
        run: |
          set -euo pipefail
          tag_sha="$(bash scripts/validate-release-tag.sh "$RELEASE_TAG")"
          test "${#tag_sha}" -eq 40
          echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"
          echo "Release tag $RELEASE_TAG resolved once to $tag_sha"

  build:
    name: Build ${{ matrix.asset }}
    needs: validate-release-tag
    env:
      RELEASE_SHA: ${{ needs.validate-release-tag.outputs.tag_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux uses cross-rs' versioned musl toolchains instead of the
          # rolling runner's glibc. Both rows deliberately run on the stable
          # x86_64 Ubuntu image; the arm64 artifact is smoke-tested through
          # explicit QEMU emulation below.
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: krometrail-linux-x64
            extension: ""
            smoke_platform: linux/amd64
            smoke_image: docker.io/library/alpine:3.22@sha256:7c8cb692ae09657cbc4a3f3cbd0e8d5a2690ba38386aaaf252dbb060bf5eb2e6
          - runner: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            asset: krometrail-linux-arm64
            extension: ""
            smoke_platform: linux/arm64/v8
            smoke_image: docker.io/library/alpine:3.22@sha256:2c9d26f410d032d5b1525aa8a873e238b05b90c4ae8618743d4311f0cc827e37
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: krometrail-darwin-x64
            extension: ""
          - runner: macos-14
            target: aarch64-apple-darwin
            asset: krometrail-darwin-arm64
            extension: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: krometrail-windows-x64.exe
            extension: ".exe"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout immutable release commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.validate-release-tag.outputs.tag_sha }}
          fetch-depth: 1

      - name: Verify immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Install Rust toolchain for native target
        if: contains(matrix.target, 'linux-musl') == false
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts for native target
        if: contains(matrix.target, 'linux-musl') == false
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}

      # v1.0.8 action syntax and cross 0.2.5 target images were verified
      # against their authoritative upstream sources before pinning.
      - name: Build Linux musl release binary
        if: contains(matrix.target, 'linux-musl')
        uses: houseabsolute/actions-rust-cross@21b0f18dc621b25bfae556ff2791fca4173121e8 # v1.0.8
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--locked --release"
          cross-version: v0.2.5

      - name: Build native release binary
        if: contains(matrix.target, 'linux-musl') == false
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Stage release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/krometrail${{ matrix.extension }}" "dist/${{ matrix.asset }}"
          test -f "dist/${{ matrix.asset }}"

      - name: Set up ARM64 emulation for artifact smoke test
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Smoke-test release asset in matching architecture
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl|aarch64-unknown-linux-musl)
              docker run --rm --platform "${{ matrix.smoke_platform }}" \
                -v "$PWD/dist:/dist:ro" \
                "${{ matrix.smoke_image }}" \
                "/dist/${{ matrix.asset }}" --version
              ;;
            *)
              "./dist/${{ matrix.asset }}" --version
              ;;
          esac

      - name: Qualify staged asset MCP protocols before publication
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl|aarch64-unknown-linux-musl)
              container="mcp-smoke-${{ github.run_id }}-${{ matrix.asset }}"
              trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
              python3 scripts/mcp-asset-smoke.py --version "${RELEASE_TAG#v}" -- \
                docker run --rm -i --name "$container" --platform "${{ matrix.smoke_platform }}" \
                -v "$PWD/dist:/dist:ro" "${{ matrix.smoke_image }}" \
                "/dist/${{ matrix.asset }}" mcp
              ;;
            *)
              python3 scripts/mcp-asset-smoke.py --version "${RELEASE_TAG#v}" -- "./dist/${{ matrix.asset }}" mcp
              ;;
          esac

      - name: Attest release asset
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/${{ matrix.asset }}

      - name: Upload release asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [validate-release-tag, build]
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ needs.validate-release-tag.outputs.tag_sha }}
    steps:
      - name: Checkout immutable release commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.validate-release-tag.outputs.tag_sha }}
          fetch-depth: 1

      - name: Verify immutable checkout
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Verify publication tag identity before upload
        run: bash scripts/verify-release-tag-identity.sh "$RELEASE_TAG" "$RELEASE_SHA"

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Verify release matrix and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            krometrail-linux-x64
            krometrail-linux-arm64
            krometrail-darwin-x64
            krometrail-darwin-arm64
            krometrail-windows-x64.exe
          )
          for asset in "${expected[@]}"; do
            test -f "dist/${asset}"
          done
          (cd dist && sha256sum "${expected[@]}" > checksums.txt)
          test "$(wc -l < dist/checksums.txt)" -eq "${#expected[@]}"

      # Draft first so the release is never observable with a partial asset set.
      # A consumer that resolves an exact version must either see every asset and
      # its checksum, or see nothing at all.
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          generate_release_notes: true
          files: |
            dist/krometrail-linux-x64
            dist/krometrail-linux-arm64
            dist/krometrail-darwin-x64
            dist/krometrail-darwin-arm64
            dist/krometrail-windows-x64.exe
            dist/checksums.txt

      - name: Verify draft carries the complete asset set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            krometrail-linux-x64
            krometrail-linux-arm64
            krometrail-darwin-x64
            krometrail-darwin-arm64
            krometrail-windows-x64.exe
            checksums.txt
          )
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > /tmp/published.txt
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected.txt
          if ! diff -u /tmp/expected.txt /tmp/published.txt; then
            echo "draft asset set does not match the expected release matrix" >&2
            exit 1
          fi
          # The draft must still be a draft at this point; publishing happens
          # only after this verification succeeds.
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = "true"

      - name: Verify publication tag identity before publish
        run: bash scripts/verify-release-tag-identity.sh "$RELEASE_TAG" "$RELEASE_SHA"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: Verify publication tag identity after publish
        run: bash scripts/verify-release-tag-identity.sh "$RELEASE_TAG" "$RELEASE_SHA"
