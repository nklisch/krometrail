<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
	<defs>
		<!-- Soft sage glow behind logo -->
		<radialGradient id="glow" cx="50%" cy="42%" r="42%">
			<stop offset="0%" stop-color="#8fae8b" stop-opacity="0.14"/>
			<stop offset="100%" stop-color="#1b1d1f" stop-opacity="0"/>
		</radialGradient>
		<!-- Subtle top border -->
		<linearGradient id="topBorder" x1="0" y1="0" x2="1200" y2="0">
			<stop offset="0%" stop-color="#1b1d1f"/>
			<stop offset="35%" stop-color="#7a9a76"/>
			<stop offset="65%" stop-color="#a3bda0"/>
			<stop offset="100%" stop-color="#1b1d1f"/>
		</linearGradient>
	</defs>

	<!-- Background -->
	<rect width="1200" height="630" fill="#1b1d1f"/>

	<!-- Top accent bar -->
	<rect width="1200" height="3" fill="url(#topBorder)"/>

	<!-- Background glow -->
	<rect width="1200" height="630" fill="url(#glow)"/>

	<!-- Logo mark — scaled up K from favicon -->
	<g transform="translate(520, 120) scale(3.5)">
		<rect width="32" height="32" rx="7" fill="#7a9a76"/>
		<g transform="translate(16,16) scale(1.18) translate(-16,-16)">
			<line x1="9" y1="7" x2="9" y2="25" stroke="white" stroke-width="3.25" stroke-linecap="round"/>
			<line x1="9" y1="16" x2="20" y2="7" stroke="white" stroke-width="3.25" stroke-linecap="round"/>
			<line x1="9" y1="16" x2="19" y2="24" stroke="white" stroke-width="3.25" stroke-linecap="round"/>
			<circle cx="20" cy="16" r="5.5" fill="#a3bda0"/>
		</g>
	</g>

	<!-- Brand name -->
	<text x="600" y="315" text-anchor="middle"
		font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
		font-weight="600" font-size="52" fill="#8fae8b" letter-spacing="-1">
		Krometrail
	</text>

	<!-- Headline -->
	<text x="600" y="372" text-anchor="middle"
		font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
		font-weight="650" font-size="44" fill="#d7d9dc" letter-spacing="-0.5">
		Give your agent motion vision
	</text>
	<text x="600" y="426" text-anchor="middle"
		font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
		font-weight="650" font-size="44" fill="#d7d9dc" letter-spacing="-0.5">
		without video
	</text>

	<!-- Tagline -->
	<text x="600" y="478" text-anchor="middle"
		font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
		font-weight="400" font-size="23" fill="#959ba3">
		Catch the flicker, jump, and half-rendered state that
	</text>
	<text x="600" y="508" text-anchor="middle"
		font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
		font-weight="400" font-size="23" fill="#959ba3">
		disappears before the next screenshot.
	</text>

	<!-- Decorative: small feature pills -->
	<g font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="500">
		<rect x="345" y="545" width="160" height="32" rx="16" fill="none" stroke="#8fae8b" stroke-opacity="0.45"/>
		<text x="425" y="566" text-anchor="middle" fill="#8fae8b">Storyboards</text>

		<rect x="520" y="545" width="170" height="32" rx="16" fill="none" stroke="#8fae8b" stroke-opacity="0.45"/>
		<text x="605" y="566" text-anchor="middle" fill="#8fae8b">Difference Maps</text>

		<rect x="705" y="545" width="150" height="32" rx="16" fill="none" stroke="#8fae8b" stroke-opacity="0.45"/>
		<text x="780" y="566" text-anchor="middle" fill="#8fae8b">Motion History</text>
	</g>
</svg>
