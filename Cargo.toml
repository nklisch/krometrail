[package]
name = "krometrail"
version = "1.1.2"
edition = "2024"
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[workspace]
resolver = "2"
members = [
  "crates/krometrail-core",
  "crates/krometrail-cdp",
  "crates/krometrail-ffmpeg",
  "crates/krometrail-store",
  "crates/krometrail-mcp",
  "crates/temporal-vision",
  "crates/temporal-evaluation",
]

[workspace.package]
version = "1.1.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/nklisch/krometrail"

[workspace.dependencies]
krometrail-core = { path = "crates/krometrail-core" }
krometrail-cdp = { path = "crates/krometrail-cdp" }
krometrail-ffmpeg = { path = "crates/krometrail-ffmpeg" }
krometrail-store = { path = "crates/krometrail-store" }
krometrail-mcp = { path = "crates/krometrail-mcp" }
temporal-vision = { path = "crates/temporal-vision" }
temporal-evaluation = { path = "crates/temporal-evaluation" }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
cdpkit = "=0.4.0"
futures-util = "0.3"
image = { version = "=0.25.9", default-features = false, features = ["jpeg", "png"] }
schemars = { version = "1", features = ["uuid1"] }
rmcp = { version = "=0.11.0", features = ["transport-io"] }
tokio-util = "0.7"
sha2 = "0.10"
png = "=0.17.16"
crc32fast = "1"
libc = "0.2"
tempfile = "3"
rusqlite = { version = "=0.33.0", default-features = false, features = ["bundled"] }
tokio-tungstenite = "=0.30.0"
url = "2"

[features]
default = []
# Test-only opt-in for local live qualification; it is never enabled by product defaults.
qualification-support = [
    "dep:temporal-evaluation",
    "krometrail-cdp/qualification-support",
    "krometrail-store/qualification-support",
]

[dependencies]
clap.workspace = true
krometrail-core.workspace = true
krometrail-cdp.workspace = true
krometrail-ffmpeg.workspace = true
krometrail-store.workspace = true
krometrail-mcp.workspace = true
temporal-vision.workspace = true
image.workspace = true
temporal-evaluation = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
libc.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
