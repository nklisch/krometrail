[package]
name = "krometrail"
version = "0.2.20"
edition = "2024"
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[workspace]
resolver = "2"
members = [
  "crates/krometrail-core",
  "crates/krometrail-cdp",
  "crates/krometrail-store",
  "crates/krometrail-mcp",
  "crates/temporal-vision",
]

[workspace.package]
version = "0.2.20"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/nklisch/krometrail"

[workspace.dependencies]
krometrail-core = { path = "crates/krometrail-core" }
krometrail-cdp = { path = "crates/krometrail-cdp" }
krometrail-store = { path = "crates/krometrail-store" }
krometrail-mcp = { path = "crates/krometrail-mcp" }
temporal-vision = { path = "crates/temporal-vision" }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "time"] }
tracing = "0.1"
cdpkit = "=0.4.0"
futures-util = "0.3"
schemars = "1"
sha2 = "0.10"
png = "=0.17.16"
crc32fast = "1"
libc = "0.2"
tokio-tungstenite = "=0.30.0"
url = "2"

[dependencies]
clap.workspace = true
krometrail-core.workspace = true
krometrail-cdp.workspace = true
krometrail-store.workspace = true
krometrail-mcp.workspace = true
temporal-vision.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
