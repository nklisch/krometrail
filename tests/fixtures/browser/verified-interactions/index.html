<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verified interactions fixture</title>
  <style>
    body { margin: 0; min-height: 1400px; font: 16px sans-serif; }
    main { padding: 24px; }
    #coordinate-target { position: absolute; left: 500px; top: 80px; width: 120px; height: 80px; background: #48a; }
    #scrolled-click-target { position: absolute; left: 500px; top: 1200px; }
    #confirm-target { position: absolute; left: 500px; top: 200px; }
    #prompt-target { position: absolute; left: 500px; top: 240px; }
    #hover-target:hover { background: rgb(0, 128, 0); }
    #drag-source { width: 80px; height: 50px; background: #c84; }
    #drop-target { width: 140px; height: 80px; margin-top: 12px; background: #ddd; }
    #scroll-box { width: 260px; height: 100px; overflow: auto; border: 1px solid #333; }
    #scroll-content { height: 500px; padding-top: 430px; }
    #responsive-probe { width: 11px; height: 1px; }
    @media (max-width: 500px) { #responsive-probe { width: 22px; } }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <div id="responsive-probe" aria-hidden="true"></div>
    <button id="click-target">Click target</button>
    <output id="click-output">not clicked</output>
    <button id="disabled-target" disabled>Disabled target</button>
    <button id="hidden-target" class="hidden">Hidden target</button>
    <label>Text <input id="text-input" value="initial"></label>
    <form id="password-form"><label>Password <input id="password-input" type="password"></label><button>Submit password</button></form>
    <label>Area <textarea id="textarea">area</textarea></label>
    <label>Check <input id="checkbox" type="checkbox"></label>
    <label>Choice <select id="select"><option value="one">One</option><option value="two">Two</option><option value="three">Three</option></select></label>
    <label>File <input id="file-input" type="file" multiple></label>
    <div id="editable" contenteditable="true">editable</div>
    <button id="hover-target">Hover target</button>
    <div id="drag-source" draggable="true">Drag source</div>
    <div id="drop-target">Drop target</div>
    <div id="scroll-box"><div id="scroll-content"><button id="scroll-destination">Scroll destination</button></div></div>
    <button id="confirm-target">Open confirm</button>
    <button id="prompt-target">Open prompt</button>
    <output id="dialog-output">none</output>
    <div id="coordinate-target" role="button" tabindex="0">Coordinate target</div>
    <button id="scrolled-click-target">Scrolled click target</button>
    <section id="semantic-scope" tabindex="0" aria-label="Semantic scope">
      <button id="semantic-save" data-testid="semantic-primary"><span>Semantic save</span></button>
      <button class="semantic-repeat">Repeated semantic action</button>
      <button class="semantic-repeat">Repeated semantic action</button>
      <label for="semantic-explicit-input">Explicit semantic input</label>
      <input id="semantic-explicit-input">
      <label>Wrapped semantic input <input id="semantic-wrapped-input"></label>
      <span id="semantic-aria-caption">ARIA semantic input</span>
      <input id="semantic-aria-input" aria-labelledby="semantic-aria-caption">
    </section>
    <button class="semantic-repeat">Repeated semantic action</button>
  </main>
  <script>
    const state = { clicks: 0, changes: 0, keydowns: [], drops: 0, coordinateClicks: 0, scrolledClicks: 0, dialogsScheduled: 0, passwordSubmits: 0, semanticClicks: 0 };
    window.fixtureState = state;
    const byId = id => document.getElementById(id);
    byId('click-target').addEventListener('click', () => {
      state.clicks++;
      byId('click-output').value = `clicked ${state.clicks}`;
    });
    byId('text-input').addEventListener('change', () => state.changes++);
    byId('text-input').addEventListener('keydown', event => state.keydowns.push(`${event.ctrlKey ? 'Control+' : ''}${event.key}`));
    byId('password-input').value = 'x'.repeat(11);
    byId('password-form').addEventListener('submit', event => { event.preventDefault(); state.passwordSubmits++; });
    byId('drag-source').addEventListener('dragstart', event => event.dataTransfer.setData('text/plain', 'fixture'));
    byId('drop-target').addEventListener('dragover', event => event.preventDefault());
    byId('drop-target').addEventListener('drop', event => { event.preventDefault(); state.drops++; byId('drop-target').textContent = 'Dropped'; });
    byId('coordinate-target').addEventListener('click', () => {
      state.coordinateClicks++;
      byId('coordinate-target').textContent = 'Coordinate clicked';
    });
    byId('scrolled-click-target').addEventListener('click', () => {
      state.scrolledClicks++;
      byId('scrolled-click-target').textContent = 'Scrolled target clicked';
    });
    byId('semantic-save').addEventListener('click', () => { state.semanticClicks++; });
    byId('confirm-target').addEventListener('mousedown', () => { state.dialogsScheduled++; setTimeout(() => { byId('dialog-output').value = window.confirm('Confirm fixture') ? 'accepted' : 'dismissed'; }, 0); });
    byId('prompt-target').addEventListener('mousedown', () => { state.dialogsScheduled++; setTimeout(() => { const value = window.prompt('Prompt fixture', ''); byId('dialog-output').value = value === null ? 'dismissed' : `prompt:${value}`; }, 0); });
    window.replaceClickTarget = () => { const old = byId('click-target'); const replacement = old.cloneNode(true); old.replaceWith(replacement); };
  </script>
</body>
</html>
